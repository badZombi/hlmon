<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Homelab Monitor</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- ===== Main Grid View ===== -->
  <div id="grid-view">
    <header id="main-header">
      <div class="header-left">
        <span class="logo">⬡</span>
        <h1>Homelab Monitor</h1>
      </div>
      <div class="header-right">
        <span id="online-count" class="status-badge online">0 online</span>
        <span id="offline-count" class="status-badge offline">0 offline</span>
        <span id="clock"></span>
      </div>
    </header>
    <main id="device-grid"></main>
  </div>

  <!-- ===== Detail Panel ===== -->
  <div id="detail-panel" class="hidden">
    <div class="detail-overlay" id="detail-overlay"></div>
    <div class="detail-content">
      <button id="detail-close" class="close-btn" aria-label="Close">✕</button>
      <div class="detail-header">
        <span id="detail-os-icon" class="os-icon"></span>
        <div>
          <h2 id="detail-hostname"></h2>
          <p id="detail-meta" class="meta"></p>
        </div>
        <span id="detail-status-dot" class="status-dot"></span>
      </div>

      <!-- Current Metrics -->
      <div class="metric-cards">
        <div class="metric-card">
          <span class="metric-label">CPU</span>
          <span id="detail-cpu" class="metric-value">—</span>
          <div class="metric-bar"><div id="detail-cpu-bar" class="metric-bar-fill cpu"></div></div>
        </div>
        <div class="metric-card">
          <span class="metric-label">Memory</span>
          <span id="detail-mem" class="metric-value">—</span>
          <div class="metric-bar"><div id="detail-mem-bar" class="metric-bar-fill mem"></div></div>
        </div>
        <div class="metric-card">
          <span class="metric-label">Disk</span>
          <span id="detail-disk" class="metric-value">—</span>
          <div class="metric-bar"><div id="detail-disk-bar" class="metric-bar-fill disk"></div></div>
        </div>
        <div class="metric-card">
          <span class="metric-label">Ping</span>
          <span id="detail-ping" class="metric-value">—</span>
          <div class="metric-bar"><div id="detail-ping-bar" class="metric-bar-fill ping"></div></div>
        </div>
      </div>

      <div id="detail-extra">
        <p id="detail-uptime"></p>
        <p id="detail-lastseen"></p>
      </div>

      <!-- Disk mounts breakdown -->
      <div id="detail-disks-section" class="disks-section"></div>

      <!-- Time range selector -->
      <div class="time-range-selector">
        <button class="range-btn active" data-range="1h">1H</button>
        <button class="range-btn" data-range="6h">6H</button>
        <button class="range-btn" data-range="24h">24H</button>
        <button class="range-btn" data-range="7d">7D</button>
      </div>

      <!-- Charts -->
      <div class="charts-grid">
        <div class="chart-container">
          <h3>CPU Usage</h3>
          <canvas id="chart-cpu"></canvas>
        </div>
        <div class="chart-container">
          <h3>Memory Usage</h3>
          <canvas id="chart-mem"></canvas>
        </div>
        <div class="chart-container">
          <h3>Disk Usage</h3>
          <canvas id="chart-disk"></canvas>
        </div>
        <div class="chart-container">
          <h3>Ping Latency</h3>
          <canvas id="chart-ping"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
